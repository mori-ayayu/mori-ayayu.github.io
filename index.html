<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KX-15 陰極線管 · 冷間起動</title>
<link rel="stylesheet" href="style.css">
<!--
  ============================================================
  CRT SCREEN —— 一台纯粹的老式显像管屏幕
  ------------------------------------------------------------
  零构建静态页面，直接上传任意静态托管即可。
  文件分工：
    index.html  本页（结构）
    style.css   外壳样式（屏幕之外的部分）
    crt.js      WebGL 渲染引擎：曲面畸变 / 色差 / 扫描线 / 噪点 / 玻璃
    stage.js    屏幕内容层：终端状态机 + 冷启动脚本（后续扩展内容改这里）
    sound.js    开机音效合成（WebAudio，无外部音频文件）
  详细的自定义说明见同目录 README.md
  ============================================================
-->
</head>
<body>

  <!-- 屏幕外壳。真正的画面全部由 WebGL 画在 canvas 里 -->
  <div class="crt-shell">
    <canvas id="crt" width="640" height="480"></canvas>
    <!-- 电源指示 LED：通电后亮起 -->
    <div class="power-led" id="powerLed" aria-hidden="true"></div>
  </div>

  <noscript><p style="color:#888;text-align:center;padding:2em">この画面を点灯するには JavaScript が必要です。</p></noscript>

<script src="crt.js"></script>
<script src="sound.js"></script>
<script src="assets/bg-data.js"></script>
<script src="stage.js"></script>
<script>
  // 引擎与内容层对接
  (function () {
    const engine = new CRT.Engine(document.getElementById('crt'));
    const stage = new CRT.Stage({
      width: engine.contentWidth,
      height: engine.contentHeight,
      onPowerChange: function (on) {
        document.getElementById('powerLed').classList.toggle('on', on);
      }
    });

    // 每帧：内容层画荧光屏原生画面 -> WebGL 曲面化上屏
    engine.onFrame = function (ctx, time) {
      stage.render(ctx, time);
    };

    // 鼠标：换算成内容层坐标交给 stage（hover 框选用）
    const cv = document.getElementById('crt');
    function toContent(ev) {
      const r = cv.getBoundingClientRect();
      return [
        (ev.clientX - r.left) / r.width * engine.contentWidth,
        (ev.clientY - r.top) / r.height * engine.contentHeight
      ];
    }
    cv.addEventListener('mousemove', function (ev) {
      const p = toContent(ev);
      stage.pointer(p[0], p[1]);
    });
    cv.addEventListener('mouseleave', function () {
      stage.pointer(-1, -1);
    });
    cv.addEventListener('click', function (ev) {
      const p = toContent(ev);
      const act = stage.tap(p[0], p[1]);
      sound.ui(act);   // enter/back/notice/reboot 各配一种声音
    });

    // 隐藏小门：键盘 [1][2][3] 切换磷光体（绿 / 琥珀 / 白），[R] 直接冷启动
    window.addEventListener('keydown', function (e) {
      if (e.key === 'r' || e.key === 'R') { stage.restart(); sound.boot(); return; }
      if (e.key === '1') stage.setPhosphor('green');
      if (e.key === '2') stage.setPhosphor('amber');
      if (e.key === '3') stage.setPhosphor('white');
    });

    engine.start();
    // 调试/调参入口（控制台可用，正式使用也无害）
    window.__crt = { engine: engine, stage: stage, config: CRT.CONFIG };
    // 先黑屏片刻，模拟断电状态，随后自动冷启动一次
    setTimeout(function () { stage.restart(); }, 900);
  })();
</script>
</body>
</html>
